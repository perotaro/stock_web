name: Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "deploy frontend-prd" to confirm production deploy'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-deploy-frontend-prd
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate production dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch and explicit confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Frontend production deploy is only allowed from refs/heads/main." >&2
            exit 1
          fi

          if [ "${CONFIRM_PRODUCTION}" != "deploy frontend-prd" ]; then
            echo 'Type "deploy frontend-prd" to confirm production deploy.' >&2
            exit 1
          fi

  frontend-deploy:
    name: Build and deploy frontend
    needs: preflight
    runs-on: ubuntu-latest
    environment: frontend-prd
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e
        env:
          VITE_API_BASE_URL: /api
          VITE_AUTH_MODE: dev-bypass
          VITE_OIDC_AUTHORITY: http://localhost:9000/realms/guppy
          VITE_OIDC_CLIENT_ID: guppy-web-dev
          VITE_OIDC_REDIRECT_URI: http://localhost:4173/auth/callback
          VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:4173/auth/logout/callback
          VITE_OIDC_LOGOUT_ENDPOINT: http://localhost:9000/realms/guppy/protocol/openid-connect/logout
          VITE_OIDC_SCOPE: openid profile email

      - name: Validate deployment variables
        env:
          FRONTEND_AWS_ROLE_ARN: ${{ vars.FRONTEND_AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
          VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${{ vars.VITE_OIDC_POST_LOGOUT_REDIRECT_URI }}
          VITE_OIDC_LOGOUT_ENDPOINT: ${{ vars.VITE_OIDC_LOGOUT_ENDPOINT }}
          VITE_OIDC_SCOPE: ${{ vars.VITE_OIDC_SCOPE }}
        run: |
          required_vars=(
            FRONTEND_AWS_ROLE_ARN
            AWS_REGION
            FRONTEND_S3_BUCKET
            CLOUDFRONT_DISTRIBUTION_ID
            VITE_API_BASE_URL
            VITE_OIDC_AUTHORITY
            VITE_OIDC_CLIENT_ID
            VITE_OIDC_REDIRECT_URI
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI
            VITE_OIDC_LOGOUT_ENDPOINT
            VITE_OIDC_SCOPE
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Environment variable is missing: ${name}" >&2
              exit 1
            fi
          done

          if [[ ! "${FRONTEND_AWS_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "FRONTEND_AWS_ROLE_ARN must be an IAM role ARN." >&2
            exit 1
          fi

          if [[ ! "${CLOUDFRONT_DISTRIBUTION_ID}" =~ ^[A-Z0-9]+$ ]]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID has an unexpected format." >&2
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_MODE: oidc
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
          VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${{ vars.VITE_OIDC_POST_LOGOUT_REDIRECT_URI }}
          VITE_OIDC_LOGOUT_ENDPOINT: ${{ vars.VITE_OIDC_LOGOUT_ENDPOINT }}
          VITE_OIDC_SCOPE: ${{ vars.VITE_OIDC_SCOPE }}

      - name: Create deployment manifest
        run: |
          cat > deployment-manifest.json <<EOF
          {
            "environment": "frontend-prd",
            "commit_sha": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist-${{ github.sha }}
          path: |
            apps/frontend/dist
            apps/frontend/deployment-manifest.json
          retention-days: 14

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.FRONTEND_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS deployment targets
        run: |
          aws s3api head-bucket --bucket "${FRONTEND_S3_BUCKET}"
          aws cloudfront get-distribution \
            --id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --query 'Distribution.Status' \
            --output text
        env:
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Sync frontend assets to S3
        run: |
          aws s3 sync dist/ "s3://${FRONTEND_S3_BUCKET}"
        env:
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Write deployment summary
        run: |
          {
            echo "## Frontend production deploy"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Artifact: frontend-dist-${GITHUB_SHA}"
            echo "- S3 bucket: ${FRONTEND_S3_BUCKET}"
            echo "- CloudFront distribution: ${CLOUDFRONT_DISTRIBUTION_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
