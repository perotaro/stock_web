name: Frontend CI

on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E test
        run: npm run test:e2e
        env:
          VITE_API_BASE_URL: /api
          VITE_AUTH_MODE: dev-bypass
          VITE_OIDC_AUTHORITY: http://localhost:9000/realms/guppy
          VITE_OIDC_CLIENT_ID: guppy-web-dev
          VITE_OIDC_REDIRECT_URI: http://localhost:4173/auth/callback
          VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:4173/auth/logout/callback
          VITE_OIDC_LOGOUT_ENDPOINT: http://localhost:9000/realms/guppy/protocol/openid-connect/logout
          VITE_OIDC_SCOPE: openid profile email
