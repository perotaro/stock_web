name: CDK CI

on:
  pull_request:
    paths:
      - 'infra/cdk/**'
      - 'apps/backend/src/**'
      - '.github/workflows/cdk-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'infra/cdk/**'
      - 'apps/backend/src/**'
      - '.github/workflows/cdk-ci.yml'

permissions:
  contents: read

concurrency:
  group: cdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdk-ci:
    name: Build and synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Synth
        run: npm run synth -- -c config=config/dev.example.json
